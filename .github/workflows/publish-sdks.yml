name: Publish SDKs

on:
  release:
    types: [published]

jobs:
  publish-ts:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aegis/sdk-ts build
      - run: pnpm --filter @aegis/sdk-ts publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build packages/sdk-python
      - run: twine upload packages/sdk-python/dist/*
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_USERNAME: __token__

  publish-go:
    name: Tag Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Go modules auto-index from GitHub tags — no publish step needed"
