# Gitleaks configuration for Aegis Lens
# Scans commits + working tree for leaked secrets.
# Run locally:  gitleaks detect --config .gitleaks.toml
# Run in CI:    via .github/workflows/ci.yml security-scan job

title = "Aegis Lens Gitleaks Config"

# Extend the default ruleset so we keep all built-in detectors
[extend]
useDefault = true

# ── Custom rules for project-specific secrets ────────────────────────────────

[[rules]]
id = "aegis-api-key"
description = "Aegis Lens API key"
regex = '''ak_(ent_|pro_)?[A-Za-z0-9]{24,}'''
keywords = ["ak_"]

[[rules]]
id = "aegis-internal-secret"
description = "Aegis internal service secret"
regex = '''(?i)(internal[_-]?secret|cron[_-]?secret)["'\s:=]{1,4}[A-Za-z0-9+/]{16,}'''
keywords = ["internal_secret", "cron_secret"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\d{8,10}:[A-Za-z0-9_-]{35}'''
keywords = ["bot", "telegram"]

[[rules]]
id = "mapbox-token"
description = "Mapbox access token"
regex = '''(pk|sk)\.eyJ[A-Za-z0-9_-]{50,}'''
keywords = ["mapbox", "pk.ey", "sk.ey"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{90,}'''
keywords = ["sk-ant"]

# ── Allowlist (false positives / intentional test fixtures) ──────────────────

[allowlist]
description = "Global allowlist"
paths = [
  '''.*\.lock$''',
  '''pnpm-lock\.yaml$''',
  '''.*\.test\.(ts|js)$''',
  '''.*\.spec\.(ts|js)$''',
  '''.*/fixtures/.*''',
  '''.*/__mocks__/.*''',
  '''docs/.*\.md$''',           # docs contain example/placeholder tokens
]

regexes = [
  '''dev-secret''',             # local dev placeholder used across the repo
  '''playground-secret''',      # webhook playground demo secret
  '''ak_ent_demo''',
  '''ak_pro_demo''',
  '''your-?secret-?here''',
  '''xxx+''',
  '''example\.com''',
]

# Stopwords reduce entropy-based false positives
stopwords = [
  "example",
  "placeholder",
  "changeme",
  "demo",
  "sample",
  "fixture",
]
