[databases]
; Production — route to primary + replica
aegis = host=POSTGRES_HOST_PRIMARY port=5432 dbname=aegis
aegis_readonly = host=POSTGRES_HOST_REPLICA port=5432 dbname=aegis

[pgbouncer]
; Mode: transaction is safest for serverless/short-lived connections
pool_mode = transaction

; Listen
listen_addr = 0.0.0.0
listen_port = 6432

; Auth
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Enable HBA for role-based access
auth_hba_file = /etc/pgbouncer/pg_hba.conf

; Pool sizing
; max_client_conn: total connections from app servers
max_client_conn = 1000
; default_pool_size: per-db-user server connections to Postgres
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Timeouts
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 0
query_wait_timeout = 120
connect_timeout = 15

; Connection lifetime — prevent stale connections
server_lifetime = 3600
server_reset_query = DISCARD ALL

; TLS — required for all connections
server_tls_sslmode = require
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/server.crt
client_tls_key_file = /etc/pgbouncer/server.key

; Admin
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

; Logging
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; DO NOT set application_name_add_host = 1 in prod (query log PII)
application_name_add_host = 0
