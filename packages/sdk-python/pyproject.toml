[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-lens"
version = "0.1.0"
description = "Official Python SDK for the Aegis Lens conflict intelligence platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Aegis Lens", email = "sdk@aegislens.com" }]
keywords = ["osint", "ukraine", "conflict", "intelligence", "geospatial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "typing-extensions>=4.0; python_version<'3.11'",
]

[project.optional-dependencies]
async = ["httpx[http2]>=0.27,<1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "mypy>=1.10"]

[project.urls]
Homepage = "https://aegislens.com"
Documentation = "https://docs.aegislens.com/sdk/python"
Repository = "https://github.com/aegis-lens/sdk-python"

[tool.hatch.version]
path = "src/aegis/__init__.py"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
