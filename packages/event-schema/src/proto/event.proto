// Aegis Lens — Canonical Event Schema v1 (Protobuf)
//
// Generated from TypeScript AegisEventV1 in packages/event-schema/src/v1.ts
// Keep in sync with EVENT_SCHEMA_VERSION = "1.0.0"
//
// Wire format notes:
//   - field numbers 1-50 are reserved for v1 core fields
//   - field numbers 51-100 are reserved for v1 optional/extension fields
//   - field numbers >= 101 are available for v2+
//   - All timestamps are ISO-8601 strings (not int64) for cross-language readability

syntax = "proto3";

package aegis.events.v1;

option go_package = "github.com/aegis-lens/proto/events/v1";
option java_package = "com.aegislens.events.v1";

// ── Sub-messages ──────────────────────────────────────────────────────────────

message GeoPoint {
  double lat = 1;
  double lon = 2;
  // Uncertainty radius in meters (1-sigma); 0 means unset
  double uncertainty_m = 3;
}

message LocalizedText {
  // BCP-47 locale -> text
  map<string, string> translations = 1;
}

message SourceCitation {
  string source_id   = 1;
  string source_type = 2; // EventSource enum as string
  string url         = 3;
  string captured_at = 4; // ISO-8601
  string archive_url = 5;
}

message EventLink {
  string event_id  = 1;
  string link_type = 2; // caused_by | caused | same_incident | corroborates | contradicts | supersedes
}

// ── Enums ─────────────────────────────────────────────────────────────────────

enum VerificationState {
  VERIFICATION_STATE_UNSPECIFIED = 0;
  UNVERIFIED  = 1;
  IN_REVIEW   = 2;
  VERIFIED    = 3;
  DISPUTED    = 4;
  RETRACTED   = 5;
}

// ── Core event message ────────────────────────────────────────────────────────

message AegisEventV1 {
  // Identity
  string event_id        = 1; // UUIDv7
  string schema_version  = 2; // "1.0.0"

  // Classification
  string event_class     = 3; // EventClass enum as string
  string subclass        = 4; // optional domain-specific subclass

  // Location
  GeoPoint location      = 5;
  string country         = 6; // ISO 3166-1 alpha-2
  string region_code     = 7; // ISO 3166-2

  // Scoring
  int32  severity        = 8;  // 1-5
  double confidence      = 9;  // 0.0-1.0
  double danger_score    = 10; // 0-100, server-generated
  string danger_band     = 11; // calm|elevated|active|high|critical

  // Verification
  VerificationState verification_state = 12;
  repeated string reviewer_ids         = 13;

  // Timestamps (ISO-8601 UTC)
  string occurred_at     = 14;
  string ingested_at     = 15;
  string updated_at      = 16;

  // Content
  LocalizedText title         = 17;
  LocalizedText summary       = 18;
  string original_text        = 19;
  repeated string media_urls  = 20;

  // Citations
  repeated SourceCitation citations = 21;

  // Cross-references
  repeated EventLink links = 22;

  // Multi-tenancy
  string org_id  = 23;
  bool is_public = 24;

  // Retraction
  bool   is_retracted      = 25;
  string retracted_at      = 26; // ISO-8601, optional
  string retraction_reason = 27;
}

// ── Batch wrapper ─────────────────────────────────────────────────────────────

message AegisEventBatch {
  repeated AegisEventV1 events = 1;
  // Cursor for pagination (opaque token)
  string next_cursor           = 2;
  int32  total_count           = 3;
}
