aegis_lens:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'aegis') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DB_NAME', 'aegis_lens') }}"
      schema: dbt_dev
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      search_path: public,raw,staging,intermediate,marts_events,marts_regions,marts_users,marts_intelligence
    prod:
      type: postgres
      host: "{{ env_var('DB_HOST') }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DB_NAME', 'aegis_lens') }}"
      schema: dbt_prod
      threads: 8
      keepalives_idle: 0
