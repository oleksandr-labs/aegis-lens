version: 2

models:
  - name: stg_events
    description: Cleaned and cast events — deduplicated, retracted events removed, coordinates validated.
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "confidence between 0.0 and 1.0"
      - dbt_utils.expression_is_true:
          expression: "severity between 1 and 5"
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: class
        data_tests: [not_null]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]
      - name: geom
        description: PostGIS POINT(lon lat) SRID 4326
        data_tests: [not_null]
      - name: occurred_at
        data_tests: [not_null]
      - name: confidence
        data_tests: [not_null]
